id: generate-consume-quality
namespace: sport

description: >
  Génère les activités sportives, les charge dans PostgreSQL
  puis contrôle leur qualité avec Soda.

tasks:
  - id: generate
    type: io.kestra.plugin.core.http.Request
    uri: http://sport_app:8000/generate
    method: POST

  - id: consume
    type: io.kestra.plugin.core.http.Request
    uri: http://sport_app:8000/consume
    method: POST

  - id: quality
    type: io.kestra.plugin.core.http.Request
    uri: http://sport_app:8000/quality
    method: POST